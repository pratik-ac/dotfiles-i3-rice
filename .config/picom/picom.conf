backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -5;
shadow-offset-y = -5;
# Disable shadows for transparent windows (avoid black glow)
shadow-exclude = [
  "bounding_shaped",
  "argb"
];

inactive-opacity = 1.0;
active-opacity = 1.0;

corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Alacritty'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

